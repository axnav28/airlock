[project]
name = "airlock"
version = "0.1.0"
description = "A provenance-aware execution boundary for personal AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.50",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
